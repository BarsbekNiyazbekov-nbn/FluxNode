<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="qew8vFM_6pNZSCeajjGMCxwi8aqNZi5BlGP6Jd6-2CQ" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="FluxNode — индивидуальная игровая вселенная. Играй и делись своими проектами.">
    <meta name="keywords" content="FluxNode, игры, разработка игр, brainrot, rng игры">
    
    <title>FluxNode | Игровая Вселенная</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffa3; --bg: #050505; --panel: #111; --error: #ff4757; --active-push: scale(0.95); }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden; 
            overflow-y: auto; 
            min-height: 100vh;
        }
        
        button, .nav-item, .game-card, .u-tab, .rate-btn, .avatar-circle {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        button:active, .nav-item:active, .game-card:active, .rate-btn:active {
            transform: var(--active-push);
        }

        header { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(5,5,5,0.95); z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 1.6rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: #888; padding: 5px 10px; }
        .nav-item:hover { color: #fff; }
        .nav-item.active { color: var(--accent); }
        
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); cursor: pointer; }
        .avatar-circle:hover { box-shadow: 0 0 15px var(--accent); }

        .container { padding: 30px 40px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        .game-card { background: var(--panel); border-radius: 20px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; }
        .game-card:hover { border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }

        .more-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 10;
        }
        .more-btn:hover { background: #333; }
        
        .dropdown-menu {
            position: absolute;
            top: 45px;
            right: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            display: none;
            z-index: 11;
            overflow: hidden;
        }
        .dropdown-item {
            padding: 10px 20px;
            font-size: 0.8rem;
            color: var(--error);
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .dropdown-item:hover { background: #252525; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .form-box { max-width: 500px; margin: 30px auto; background: #0c0c0c; border-radius: 25px; padding: 35px; border: 1px solid #222; text-align: center; }
        input, select, textarea { width: 100%; background: #151515; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; outline: none; }
        input:focus { border-color: var(--accent); }

        .btn-main { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 20px; }
        .btn-main:hover { background: #00d688; box-shadow: 0 5px 15px rgba(0,255,163,0.3); }

        .btn-logout-red { width: 100%; padding: 12px; background: none; border: 1px solid var(--error); color: var(--error); border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .btn-logout-red:hover { background: var(--error); color: white; }

        .social-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google { background: white; color: #333; }
        .btn-apple { background: #000; color: white; border: 1px solid #444; }
        .btn-fb { background: #1877F2; color: white; }

        .play-container { max-width: 900px; margin: 0 auto; display: none; padding-top: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .play-top { display: flex; gap: 25px; align-items: flex-start; margin-bottom: 25px; flex-wrap: wrap; }
        .play-img-big { width: 220px; height: 140px; border-radius: 15px; object-fit: cover; border: 1px solid #333; }
        .play-author { display: flex; align-items: center; gap: 10px; color: #888; margin-top: 10px; }
        .play-author img { width: 30px; height: 30px; border-radius: 50%; }

        .btn-play-wide { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        
        .rating-box { display: flex; gap: 15px; margin-bottom: 25px; }
        .rate-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px 25px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .rate-btn:hover { background: #222; }
        .rate-btn.liked { color: var(--accent); border-color: var(--accent); }
        .rate-btn.disliked { color: var(--error); border-color: var(--error); }

        .description-text { line-height: 1.6; color: #bbb; background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; }

        .logout-text { font-size: 0.65rem; color: #ff4757; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 2px; }
        .logout-text:hover { text-decoration: underline; }

        @media (max-width: 1023px) {
            .pc-only, #authBox { display: none !important; }
            .nav-item#nav-my { display: none !important; }
        }
        
        @media (min-width: 1024px) {
            .pc-only { display: block; }
        }
    </style>
</head>
<body>

<img src="logo.png" style="width:100%; max-height:300px; object-fit:cover;">

<header>
    <div class="logo" onclick="location.reload()">FluxNode</div>
    <div class="nav-links">
        <span class="nav-item active" id="nav-rec" onclick="showTab('rec')">Рекомендации</span>
        <span class="nav-item pc-only" id="nav-my" style="display:none;" onclick="showTab('my')">Мои игры</span>
    </div>
    <div id="authBox">
        <button onclick="openModal('regModal')" class="btn-main" style="margin:0; padding:10px 20px; width:auto; font-size:0.8rem;">РЕГИСТРАЦИЯ</button>
    </div>
</header>

<div class="container">
    <div id="mainContent">
        <h2 id="tabTitle" style="margin-bottom:25px; font-weight: 900; letter-spacing: -1px;">РЕКОМЕНДАЦИИ</h2>
        <div class="game-grid" id="gameGrid"></div>
    </div>

    <div id="playPage" class="play-container">
        <button onclick="closePlay()" style="background:none; border:none; color:var(--accent); cursor:pointer; margin-bottom:20px; font-weight: bold;">← НАЗАД</button>
        <div class="play-top">
            <img id="pImg" class="play-img-big" src="">
            <div class="play-meta">
                <h1 id="pTitle" style="margin:0; font-size: 2.5rem;">Название игры</h1>
                <div class="play-author">
                    <img id="pAuthAv" src="">
                    <span id="pAuthNick">@автор</span>
                </div>
            </div>
        </div>
        <button class="btn-play-wide">ИГРАТЬ</button>
        <div class="rating-box">
            <button id="likeBtn" class="rate-btn" onclick="rate('like')">👍 <span id="pLikes">0</span></button>
            <button id="disBtn" class="rate-btn" onclick="rate('dislike')">👎 <span id="pDis">0</span></button>
        </div>
        <div class="description-text">
            <h4 style="margin-top:0; color:var(--accent); text-transform: uppercase;">Описание:</h4>
            <div id="pDesc">Тут будет описание игры...</div>
        </div>
    </div>
</div>

<div class="modal" id="regModal">
    <div class="form-box">
        <div id="stepSocial">
            <h2 style="margin-top:0;">ВОЙТИ ЧЕРЕЗ</h2>
            <button class="social-btn btn-google" onclick="nextStep()">Google</button>
            <button class="social-btn btn-apple" onclick="nextStep()">Apple ID</button>
            <button class="social-btn btn-fb" onclick="nextStep()">Facebook</button>
            <p onclick="closeModal('regModal')" style="opacity:0.5; cursor:pointer; margin-top:20px;">Отмена</p>
        </div>
        <div id="stepProfile" style="display:none;">
            <h2 style="margin-top:0;">ПРОФИЛЬ</h2>
            <input type="text" id="regNick" placeholder="Придумайте ник">
            <label style="display:block; margin-top:20px; text-align:left;">Загрузите аватарку:</label>
            <input type="file" id="regAvatar" accept="image/*">
            <button class="btn-main" onclick="register()">ЗАВЕРШИТЬ</button>
        </div>
    </div>
</div>

<div class="modal" id="editProfileModal">
    <div class="form-box">
        <h2 style="color:var(--accent); margin-top:0;">РЕДАКТИРОВАТЬ ПРОФИЛЬ</h2>
        <input type="text" id="editNick" placeholder="Новый никнейм">
        <label style="display:block; margin-top:20px; text-align:left;">Новая аватарка (необязательно):</label>
        <input type="file" id="editAvatar" accept="image/*">
        <button class="btn-main" onclick="saveProfileChanges()">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        
        <button class="btn-logout-red" onclick="logout()">ВЫЙТИ ИЗ АККАУНТА</button>
        
        <p onclick="closeModal('editProfileModal')" style="text-align:center; cursor:pointer; opacity:0.5; margin-top:20px;">Отмена</p>
    </div>
</div>

<div class="modal" id="pubModal">
    <div class="form-box">
        <h2 style="color:var(--accent); margin-top:0;">НОВАЯ ПУБЛИКАЦИЯ</h2>
        <input type="text" id="gName" placeholder="Название вашей игры">
        <textarea id="gDesc" placeholder="О чем ваша игра? Расскажите подробнее..." rows="4"></textarea>
        <label style="display:block; margin-top:20px;">Картинка (обложка):</label>
        <input type="file" id="gCover" accept="image/*">
        <label style="display:block; margin-top:20px;">Загрузка проекта:</label>
        <select id="uTypeSelect" onchange="updateFileInput(this.value)" style="margin-bottom:10px;">
            <option value="file">Один файл (.html)</option>
            <option value="folder">Папка проекта</option>
        </select>
        <input type="file" id="gMainFile">
        <button class="btn-main" onclick="publish()">ОПУБЛИКОВАТЬ В СЕТЬ</button>
        <p onclick="closeModal('pubModal')" style="text-align:center; cursor:pointer; opacity:0.5; margin-top:20px;">Отмена</p>
    </div>
</div>

<div id="gameScreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">
    <button onclick="closeGameScreen()" style="position:absolute; top:20px; right:20px; z-index:10000; padding:10px 20px; background:var(--error); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">ЗАКРЫТЬ ИГРУ</button>
    <iframe id="gameIframe" src="" style="width:100%; height:100%; border:none; background:white;"></iframe>
</div>

<script>
    // Было:
let games = JSON.parse(localStorage.getItem('pj_games')) || [];

// Сделай так (добавь стандартную игру):
let defaultGame = {
    id: 1,
    name: "Brainrot Clicker",
    desc: "Лучший кликер для настоящих сигм!",
    cover: "ссылка_на_картинку.jpg",
    gameData: "index2.html", // Тут должен быть путь к файлу самой игры
    author: "bars",
    authorAv: "ссылка_на_аву.jpg",
    likes: 61, dislikes: 9
};

let games = JSON.parse(localStorage.getItem('pj_games')) || [defaultGame];
</script>

</body>
</html>
