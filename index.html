<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="qew8vFM_6pNZSCeajjGMCxwi8aqNZi5BlGP6Jd6-2CQ" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FluxNode — индивидуальная игровая вселенная. Играй и делись своими проектами.">
    <meta name="keywords" content="FluxNode, игры, разработка игр, brainrot, rng игры">
    <title>FluxNode | Игровая Вселенная</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #00ffa3; --bg: #050505; --panel: #111; --error: #ff4757; --active-push: scale(0.95); }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; overflow-x: hidden; overflow-y: auto; min-height: 100vh; }
        button, .nav-item, .game-card, .u-tab, .rate-btn, .avatar-circle { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); user-select: none; }
        button:active, .nav-item:active, .game-card:active, .rate-btn:active { transform: var(--active-push); }
        header { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(5,5,5,0.95); z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 1.6rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: #888; padding: 5px 10px; }
        .nav-item:hover { color: #fff; }
        .nav-item.active { color: var(--accent); }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); cursor: pointer; }
        .avatar-circle:hover { box-shadow: 0 0 15px var(--accent); }
        .container { padding: 30px 40px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .game-card { background: var(--panel); border-radius: 20px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; }
        .game-card:hover { border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .more-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 10; }
        .more-btn:hover { background: #333; }
        .dropdown-menu { position: absolute; top: 45px; right: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; display: none; z-index: 11; overflow: hidden; }
        .dropdown-item { padding: 10px 20px; font-size: 0.8rem; color: var(--error); font-weight: bold; cursor: pointer; white-space: nowrap; }
        .dropdown-item:hover { background: #252525; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .form-box { max-width: 500px; margin: 30px auto; background: #0c0c0c; border-radius: 25px; padding: 35px; border: 1px solid #222; text-align: center; }
        input, select, textarea { width: 100%; background: #151515; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn-main { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 20px; }
        .btn-main:hover { background: #00d688; box-shadow: 0 5px 15px rgba(0,255,163,0.3); }
        .btn-logout-red { width: 100%; padding: 12px; background: none; border: 1px solid var(--error); color: var(--error); border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .btn-logout-red:hover { background: var(--error); color: white; }
        .social-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google { background: white; color: #333; }
        .btn-apple { background: #000; color: white; border: 1px solid #444; }
        .play-container { max-width: 900px; margin: 0 auto; display: none; padding-top: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .play-top { display: flex; gap: 25px; align-items: flex-start; margin-bottom: 25px; flex-wrap: wrap; }
        .play-img-big { width: 220px; height: 140px; border-radius: 15px; object-fit: cover; border: 1px solid #333; }
        .play-author { display: flex; align-items: center; gap: 10px; color: #888; margin-top: 10px; }
        .play-author img { width: 30px; height: 30px; border-radius: 50%; }
        .btn-play-wide { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .rating-box { display: flex; gap: 15px; margin-bottom: 25px; }
        .rate-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px 25px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .rate-btn:hover { background: #222; }
        .rate-btn.liked { color: var(--accent); border-color: var(--accent); }
        .rate-btn.disliked { color: var(--error); border-color: var(--error); }
        .description-text { line-height: 1.6; color: #bbb; background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; }
        .no-results { text-align: center; padding: 60px 20px; color: #555; font-size: 1.1rem; }
        @media (max-width: 1023px) { .desktop-only { display: none !important; } .nav-item#nav-my { display: none !important; } }
        @media (min-width: 1024px) { .desktop-only { display: block; } }
    </style>
</head>
<body>

<img src="logo.png" style="width:100%; max-height:300px; object-fit:cover;">

<header>
    <div class="logo" onclick="location.reload()">FluxNode</div>
    <div class="nav-links">
        <span class="nav-item active" id="nav-rec" onclick="showTab('rec')">Рекомендации</span>
        <span class="nav-item desktop-only" id="nav-my" style="display:none;" onclick="showTab('my')">Мои игры</span>
    </div>
    <div id="authBox">
        <button onclick="openModal('loginModal')" class="btn-main" style="margin:0; padding:10px 20px; width:auto; font-size:0.8rem;">ВХОД</button>
    </div>
</header>

<div class="container">
    <div id="mainContent">
        <div style="margin-bottom:25px; display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
            <h2 id="tabTitle" style="margin:0; font-weight: 900; letter-spacing: -1px;">РЕКОМЕНДАЦИИ</h2>
            <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, автору..." style="flex:1; min-width:200px; padding:10px; background:#151515; border:1px solid #333; color:white; border-radius:8px; font-family:inherit;" onkeyup="filterGames()">
        </div>
        <div class="game-grid" id="gameGrid"></div>
    </div>

    <div id="playPage" class="play-container">
        <button onclick="closePlay()" style="background:none; border:none; color:var(--accent); cursor:pointer; margin-bottom:20px; font-weight: bold;">← НАЗАД</button>
        <div class="play-top">
            <img id="pImg" class="play-img-big" src="">
            <div class="play-meta">
                <h1 id="pTitle" style="margin:0; font-size: 2.5rem;">Название игры</h1>
                <div class="play-author">
                    <img id="pAuthAv" src="">
                    <span id="pAuthNick">@автор</span>
                </div>
            </div>
        </div>
        <button class="btn-play-wide" id="playBtn">ИГРАТЬ</button>
        <div class="rating-box">
            <button id="likeBtn" class="rate-btn" onclick="rate('like')">👍 <span id="pLikes">0</span></button>
            <button id="disBtn" class="rate-btn" onclick="rate('dislike')">👎 <span id="pDis">0</span></button>
        </div>
        <div class="description-text">
            <h4 style="margin-top:0; color:var(--accent); text-transform: uppercase;">Описание:</h4>
            <div id="pDesc">Тут будет описание игры...</div>
        </div>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="form-box">
        <h2 style="margin-top:0; color:var(--accent);">ВХОД</h2>
        <button class="social-btn btn-google" onclick="loginGoogle()" style="margin-top:20px;">🔵 Google</button>
        <button class="social-btn btn-apple" onclick="loginApple()">🍎 Apple</button>
        <p onclick="closeModal('loginModal')" style="opacity:0.5; cursor:pointer; margin-top:20px;">Отмена</p>
    </div>
</div>

<div class="modal" id="pubModal">
    <div class="form-box">
        <h2 style="color:var(--accent); margin-top:0;">НОВАЯ ПУБЛИКАЦИЯ</h2>
        <input type="text" id="gName" placeholder="Название вашей игры">
        <textarea id="gDesc" placeholder="О чем ваша игра?" rows="4"></textarea>
        <label style="display:block; margin-top:20px;">Картинка (обложка):</label>
        <input type="file" id="gCover" accept="image/*">
        <label style="display:block; margin-top:20px;">Файл игры (.html):</label>
        <input type="file" id="gMainFile" accept=".html">
        <button class="btn-main" id="publishBtn" onclick="publish()">ОПУБЛИКОВАТЬ</button>
        <p onclick="closeModal('pubModal')" style="text-align:center; cursor:pointer; opacity:0.5; margin-top:20px;">Отмена</p>
    </div>
</div>

<div id="gameScreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">
    <button onclick="closeGameScreen()" style="position:absolute; top:20px; right:20px; z-index:10000; padding:10px 20px; background:var(--error); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">ЗАКРЫТЬ</button>
    <iframe id="gameIframe" src="" style="width:100%; height:100%; border:none;"></iframe>
</div>

<script>
    const SUPABASE_URL = 'https://qnmukqxvmbfyownoaklr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubXVrcXh2bWJmeW93bm9ha2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDg1ODIsImV4cCI6MjA5NDU4NDU4Mn0._fbBK7MeAEZt6K5TrNPYMtjQXfpuzNMsWvFVuU9Xfe8';
    
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = null;
    let games = [];
    let currentGId = null;
    const isMobile = window.innerWidth < 1024;

    window.onload = async () => {
        await checkAuth();
        await loadGames();
        showTab('rec');
    };

    async function checkAuth() {
        const { data } = await supabase.auth.getSession();
        user = data.session?.user || null;
        updateAuthUI();
    }

    function updateAuthUI() {
        const authBox = document.getElementById('authBox');
        if(!user) {
            authBox.innerHTML = '<button onclick="openModal(\'loginModal\')" class="btn-main" style="margin:0; padding:10px 20px; width:auto; font-size:0.8rem;">ВХОД</button>';
            if(!isMobile) document.getElementById('nav-my').style.display = 'none';
        } else {
            const nick = user.email.split('@')[0];
            const btn = isMobile ? '' : `<button class="btn-main" onclick="openModal('pubModal')" style="margin:0; padding:8px 15px; font-size:0.8rem; width:auto;">ВЫЛОЖИТЬ</button>`;
            authBox.innerHTML = `
                <div style="display:flex; align-items:center; gap:15px;">
                    ${btn}
                    <div style="text-align:center;">
                        <div style="font-size:0.8rem; color:var(--accent); font-weight:700;">${nick}</div>
                        <button onclick="logout()" style="background:none; border:none; color:#ff4757; cursor:pointer; font-size:0.7rem; margin-top:3px;">Выйти</button>
                    </div>
                </div>`;
            if(!isMobile) document.getElementById('nav-my').style.display = 'block';
        }
    }

    async function loginGoogle() {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin }
        });
        if(error) alert('Ошибка входа: ' + error.message);
    }

    async function loginApple() {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'apple',
            options: { redirectTo: window.location.origin }
        });
        if(error) alert('Ошибка входа: ' + error.message);
    }

    async function logout() {
        await supabase.auth.signOut();
        user = null;
        updateAuthUI();
        showTab('rec');
    }

    async function loadGames() {
        try {
            const { data, error } = await supabase.from('games').select('*').order('created_at', { ascending: false });
            if(error) throw error;
            games = data || [];
            renderGames(games);
        } catch(e) {
            document.getElementById('gameGrid').innerHTML = '<div class="no-results">Ошибка загрузки 😢</div>';
        }
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const isMyTab = document.getElementById('nav-my').classList.contains('active');
        let dataToFilter = isMyTab && user ? games.filter(g => g.author === user.email) : games;

        if(!query) {
            renderGames(dataToFilter);
        } else {
            const filtered = dataToFilter.filter(g => 
                g.name.toLowerCase().includes(query) || 
                g.description.toLowerCase().includes(query) ||
                g.author.toLowerCase().includes(query)
            );
            renderGames(filtered);
        }
    }

    function renderGames(data) {
        const grid = document.getElementById('gameGrid');
        if(!data || !data.length) {
            grid.innerHTML = '<div class="no-results">Игры не найдены 😢</div>';
            return;
        }
        grid.innerHTML = '';
        const isMyTab = document.getElementById('nav-my').classList.contains('active');
        
        data.forEach(g => {
            const div = document.createElement('div');
            div.className = 'game-card';
            div.onclick = () => openPlay(g.id);

            let menuHtml = '';
            if(isMyTab && user && g.author === user.email) {
                menuHtml = `<button class="more-btn" onclick="toggleMenu(event, ${g.id})">⋮</button>
                    <div class="dropdown-menu" id="menu-${g.id}">
                        <div class="dropdown-item" onclick="deleteGame(event, ${g.id})">УДАЛИТЬ</div>
                    </div>`;
            }

            div.innerHTML = `${menuHtml}
                <img src="${g.cover_url}" class="card-img" onerror="this.src='https://via.placeholder.com/300x160/111/555'">
                <div style="padding:15px;">
                    <div style="font-size:0.75rem; color:#888; margin-bottom:8px;">@${g.author.split('@')[0]}</div>
                    <h3 style="margin:0; font-size:1.1rem; color:white;">${g.name}</h3>
                    <div style="margin-top:8px; font-size:0.75rem; color:#555;">👍 ${g.likes} 👎 ${g.dislikes}</div>
                </div>`;
            grid.appendChild(div);
        });
    }

    async function publish() {
        if(!user) return alert('Войдите в аккаунт!');
        
        const name = document.getElementById('gName').value.trim();
        const desc = document.getElementById('gDesc').value.trim();
        const coverFile = document.getElementById('gCover').files[0];
        const gameFile = document.getElementById('gMainFile').files[0];

        if(!name || !coverFile || !gameFile) return alert('Заполните все поля!');
        if(!gameFile.name.endsWith('.html')) return alert('Файл должен быть .html!');

        const btn = document.getElementById('publishBtn');
        btn.disabled = true;
        btn.innerText = 'Загружаем...';

        try {
            const ts = Date.now();
            
            const { data: coverData, error: coverError } = await supabase.storage
                .from('games').upload(`covers/${ts}_${coverFile.name}`, coverFile);
            if(coverError) throw coverError;

            const { data: gameData, error: gameError } = await supabase.storage
                .from('games').upload(`files/${ts}_${gameFile.name}`, gameFile);
            if(gameError) throw gameError;

            const coverUrl = `${SUPABASE_URL}/storage/v1/object/public/games/${coverData.path}`;
            const gameUrl = `${SUPABASE_URL}/storage/v1/object/public/games/${gameData.path}`;

            const { error: insertError } = await supabase.from('games').insert([{
                name, description: desc || 'Описание не добавлено.',
                cover_url: coverUrl, game_url: gameUrl, author: user.email,
                likes: 0, dislikes: 0
            }]);

            if(insertError) throw insertError;

            closeModal('pubModal');
            document.getElementById('gName').value = '';
            document.getElementById('gDesc').value = '';
            document.getElementById('gCover').value = '';
            document.getElementById('gMainFile').value = '';
            await loadGames();
        } catch(e) {
            alert('Ошибка: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'ОПУБЛИКОВАТЬ';
        }
    }

    async function deleteGame(e, id) {
        e.stopPropagation();
        if(!confirm('Удалить игру?')) return;
        await supabase.from('games').delete().eq('id', id);
        await loadGames();
        showTab('my');
    }

    function openPlay(id) {
        const g = games.find(x => x.id === id);
        if(!g) return;
        currentGId = id;
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('playPage').style.display = 'block';
        document.getElementById('pImg').src = g.cover_url;
        document.getElementById('pTitle').innerText = g.name;
        document.getElementById('pAuthNick').innerText = '@' + g.author.split('@')[0];
        document.getElementById('pDesc').innerText = g.description;

        document.getElementById('playBtn').onclick = () => {
            document.getElementById('gameIframe').src = g.game_url;
            document.getElementById('gameScreen').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        document.getElementById('pLikes').innerText = g.likes;
        document.getElementById('pDis').innerText = g.dislikes;
    }

    async function rate(type) {
        if(!user) return alert('Войдите в аккаунт!');
        const g = games.find(x => x.id === currentGId);
        const newLikes = type === 'like' ? g.likes + 1 : g.likes;
        const newDis = type === 'dislike' ? g.dislikes + 1 : g.dislikes;
        await supabase.from('games').update({ likes: newLikes, dislikes: newDis }).eq('id', currentGId);
        await loadGames();
        openPlay(currentGId);
    }

    function toggleMenu(e, id) {
        e.stopPropagation();
        const menu = document.getElementById('menu-' + id);
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    window.onclick = () => document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');

    function showTab(tab) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('searchInput').value = '';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('playPage').style.display = 'none';

        if(tab === 'my' && user) {
            document.getElementById('nav-my').classList.add('active');
            filterGames();
            document.getElementById('tabTitle').innerText = 'МОИ ИГРЫ';
        } else {
            document.getElementById('nav-rec').classList.add('active');
            filterGames();
            document.getElementById('tabTitle').innerText = 'РЕКОМЕНДАЦИИ';
        }
    }

    function closePlay() { showTab('rec'); }
    function closeGameScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('gameIframe').src = '';
        document.body.style.overflow = 'auto';
    }
    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
