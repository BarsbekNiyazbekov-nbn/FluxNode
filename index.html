<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FluxNode — индивидуальная игровая вселенная.">
    <title>FluxNode | Игровая Вселенная</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #00ffa3; --bg: #050505; --panel: #111; --error: #ff4757; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; overflow-x: hidden; min-height: 100vh; }
        header { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(5,5,5,0.95); z-index: 100; }
        .logo { font-weight: 900; font-size: 1.6rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: #888; padding: 5px 10px; }
        .nav-item.active { color: var(--accent); }
        .container { padding: 30px 40px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .game-card { background: var(--panel); border-radius: 20px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; transition: all 0.2s; }
        .game-card:hover { border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .form-box { max-width: 500px; margin: 30px auto; background: #0c0c0c; border-radius: 25px; padding: 35px; border: 1px solid #222; text-align: center; }
        input, textarea { width: 100%; background: #151515; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #00d688; }
        .play-container { max-width: 900px; margin: 0 auto; display: none; padding-top: 20px; }
        .btn-play { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-bottom: 25px; text-transform: uppercase; }
        .no-results { text-align: center; padding: 60px 20px; color: #555; }
        #authBox button { margin: 0; padding: 10px 20px; width: auto; font-size: 0.8rem; }
        @media (max-width: 1023px) { .desktop-only { display: none !important; } }
    </style>
</head>
<body>

<img src="logo.png" style="width:100%; max-height:300px; object-fit:cover;">

<header>
    <div class="logo" onclick="location.reload()">FluxNode</div>
    <div class="nav-links">
        <span class="nav-item active" id="nav-rec" onclick="showTab('rec')">Рекомендации</span>
        <span class="nav-item desktop-only" id="nav-my" style="display:none;" onclick="showTab('my')">Мои игры</span>
    </div>
    <div id="authBox"></div>
</header>

<div class="container">
    <div id="mainContent">
        <div style="margin-bottom:25px; display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
            <h2 id="tabTitle" style="margin:0; font-weight: 900;">РЕКОМЕНДАЦИИ</h2>
            <input type="text" id="searchInput" placeholder="🔍 Поиск..." style="flex:1; min-width:200px; padding:10px; background:#151515; border:1px solid #333; color:white; border-radius:8px;" onkeyup="filterGames()">
        </div>
        <div class="game-grid" id="gameGrid"></div>
    </div>

    <div id="playPage" class="play-container">
        <button onclick="closePlay()" style="background:none; border:none; color:var(--accent); cursor:pointer; margin-bottom:20px; font-weight: bold;">← НАЗАД</button>
        <img id="pImg" style="width:220px; height:140px; border-radius:15px; object-fit:cover;" src="">
        <h1 id="pTitle" style="margin:20px 0 0 0; font-size: 2.5rem;"></h1>
        <div style="color:#888; margin:10px 0;">@<span id="pAuthor"></span></div>
        <button class="btn-play" onclick="playGame()">ИГРАТЬ</button>
        <div style="margin:20px 0;">
            <button style="background:#1a1a1a; border:1px solid #333; color:white; padding:10px 25px; border-radius:10px; cursor:pointer; margin-right:10px;" onclick="rate('like')">👍 <span id="pLikes">0</span></button>
            <button style="background:#1a1a1a; border:1px solid #333; color:white; padding:10px 25px; border-radius:10px; cursor:pointer;" onclick="rate('dislike')">👎 <span id="pDis">0</span></button>
        </div>
        <div style="line-height:1.6; color:#bbb; background:#111; padding:25px; border-radius:20px; border:1px solid #222;">
            <h4 style="margin-top:0; color:var(--accent);">Описание:</h4>
            <div id="pDesc"></div>
        </div>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="form-box">
        <h2 style="margin-top:0; color:var(--accent);">ВХОД</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Пароль">
        <button class="btn" onclick="login()">ВОЙТИ</button>
        <p style="color:#555; margin-top:15px;">Нет аккаунта? <span onclick="openModal('regModal')" style="color:var(--accent); cursor:pointer;">Регистрация</span></p>
        <button style="width:100%; padding:12px; background:none; border:1px solid #333; color:white; border-radius:10px; margin-top:15px; cursor:pointer;" onclick="closeModal('loginModal')">Отмена</button>
    </div>
</div>

<div class="modal" id="regModal">
    <div class="form-box">
        <h2 style="margin-top:0; color:var(--accent);">РЕГИСТРАЦИЯ</h2>
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль (минимум 6 символов)">
        <input type="text" id="regNick" placeholder="Никнейм">
        <button class="btn" onclick="register()">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        <p style="color:#555; margin-top:15px;">Уже есть аккаунт? <span onclick="openModal('loginModal')" style="color:var(--accent); cursor:pointer;">Вход</span></p>
        <button style="width:100%; padding:12px; background:none; border:1px solid #333; color:white; border-radius:10px; margin-top:15px; cursor:pointer;" onclick="closeModal('regModal')">Отмена</button>
    </div>
</div>

<div class="modal" id="pubModal">
    <div class="form-box">
        <h2 style="color:var(--accent); margin-top:0;">НОВАЯ ПУБЛИКАЦИЯ</h2>
        <input type="text" id="gName" placeholder="Название">
        <textarea id="gDesc" placeholder="Описание..." rows="4"></textarea>
        <label style="display:block; margin-top:20px; text-align:left;">Обложка:</label>
        <input type="file" id="gCover" accept="image/*">
        <label style="display:block; margin-top:20px; text-align:left;">Файл игры (.html):</label>
        <input type="file" id="gMainFile" accept=".html">
        <button class="btn" onclick="publish()">ОПУБЛИКОВАТЬ</button>
        <button style="width:100%; padding:12px; background:none; border:1px solid #333; color:white; border-radius:10px; margin-top:15px; cursor:pointer;" onclick="closeModal('pubModal')">Отмена</button>
    </div>
</div>

<div id="gameScreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">
    <button onclick="closeGameScreen()" style="position:absolute; top:20px; right:20px; z-index:10000; padding:10px 20px; background:var(--error); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">ЗАКРЫТЬ</button>
    <iframe id="gameIframe" style="width:100%; height:100%; border:none;"></iframe>
</div>

<script>
    const SUPABASE_URL = 'https://qnmukqxvmbfyownoaklr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubXVrcXh2bWJmeW93bm9ha2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDg1ODIsImV4cCI6MjA5NDU4NDU4Mn0._fbBK7MeAEZt6K5TrNPYMtjQXfpuzNMsWvFVuU9Xfe8';
    
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = null;
    let games = [];
    let currentGId = null;
    const isMobile = window.innerWidth < 1024;

    window.onload = async () => {
        const { data } = await supabase.auth.getSession();
        user = data.session?.user || null;
        updateAuthUI();
        await loadGames();
        showTab('rec');
    };

    function updateAuthUI() {
        const authBox = document.getElementById('authBox');
        if(!user) {
            authBox.innerHTML = '<button class="btn" onclick="openModal(\'loginModal\')">ВХОД</button>';
        } else {
            const nick = localStorage.getItem(`nick_${user.id}`) || user.email.split('@')[0];
            authBox.innerHTML = `
                <div style="display:flex; align-items:center; gap:15px;">
                    ${isMobile ? '' : `<button class="btn" onclick="openModal('pubModal')">ВЫЛОЖИТЬ</button>`}
                    <div style="text-align:right;">
                        <div style="font-size:0.9rem; color:var(--accent); font-weight:700;">${nick}</div>
                        <button onclick="logout()" style="background:none; border:none; color:#ff4757; cursor:pointer; font-size:0.8rem; margin-top:3px;">Выйти</button>
                    </div>
                </div>`;
            if(!isMobile) document.getElementById('nav-my').style.display = 'block';
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPass').value;
        if(!email || !pass) return alert('Заполните поля!');
        
        const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
        if(error) return alert('Ошибка: ' + error.message);
        user = (await supabase.auth.getSession()).data.session.user;
        closeModal('loginModal');
        updateAuthUI();
    }

    async function register() {
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPass').value;
        const nick = document.getElementById('regNick').value.trim();
        if(!email || !pass || !nick) return alert('Заполните все поля!');
        if(pass.length < 6) return alert('Пароль минимум 6 символов!');
        
        const { error, data } = await supabase.auth.signUp({ email, password: pass });
        if(error) return alert('Ошибка: ' + error.message);
        
        user = data.user;
        localStorage.setItem(`nick_${user.id}`, nick);
        closeModal('regModal');
        document.getElementById('regEmail').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('regNick').value = '';
        updateAuthUI();
    }

    async function logout() {
        await supabase.auth.signOut();
        user = null;
        updateAuthUI();
        showTab('rec');
    }

    async function loadGames() {
        const { data } = await supabase.from('games').select('*').order('created_at', { ascending: false });
        games = data || [];
        renderGames(games);
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const isMyTab = document.getElementById('nav-my').classList.contains('active');
        let filtered = isMyTab && user ? games.filter(g => g.author_id === user.id) : games;
        
        if(query) {
            filtered = filtered.filter(g => 
                g.name.toLowerCase().includes(query) || 
                g.description.toLowerCase().includes(query)
            );
        }
        renderGames(filtered);
    }

    function renderGames(data) {
        const grid = document.getElementById('gameGrid');
        if(!data.length) {
            grid.innerHTML = '<div class="no-results">Игры не найдены 😢</div>';
            return;
        }
        grid.innerHTML = data.map(g => `
            <div class="game-card" onclick="openPlay(${g.id})">
                <img src="${g.cover_url}" class="card-img" onerror="this.src='https://via.placeholder.com/300x160/111/555'">
                <div style="padding:15px;">
                    <div style="font-size:0.75rem; color:#888; margin-bottom:8px;">@${g.author_nick}</div>
                    <h3 style="margin:0; font-size:1.1rem;">${g.name}</h3>
                    <div style="margin-top:8px; font-size:0.75rem; color:#555;">👍 ${g.likes} 👎 ${g.dislikes}</div>
                </div>
            </div>
        `).join('');
    }

    async function publish() {
        if(!user) return alert('Войдите в аккаунт!');
        
        const name = document.getElementById('gName').value.trim();
        const desc = document.getElementById('gDesc').value.trim();
        const cover = document.getElementById('gCover').files[0];
        const game = document.getElementById('gMainFile').files[0];

        if(!name || !cover || !game) return alert('Заполните все поля!');
        if(!game.name.endsWith('.html')) return alert('Файл должен быть .html!');

        const coverData = await new Promise(r => { const fr = new FileReader(); fr.onload = e => r(e.target.result); fr.readAsDataURL(cover); });
        const gameData = await new Promise(r => { const fr = new FileReader(); fr.onload = e => r(e.target.result); fr.readAsDataURL(game); });

        const nick = localStorage.getItem(`nick_${user.id}`) || user.email.split('@')[0];
        const { error } = await supabase.from('games').insert([{
            name, description: desc, cover_url: coverData, game_url: gameData,
            author_id: user.id, author_nick: nick, likes: 0, dislikes: 0
        }]);

        if(error) return alert('Ошибка: ' + error.message);
        
        closeModal('pubModal');
        document.getElementById('gName').value = '';
        document.getElementById('gDesc').value = '';
        document.getElementById('gCover').value = '';
        document.getElementById('gMainFile').value = '';
        await loadGames();
    }

    function openPlay(id) {
        const g = games.find(x => x.id === id);
        currentGId = id;
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('playPage').style.display = 'block';
        document.getElementById('pImg').src = g.cover_url;
        document.getElementById('pTitle').innerText = g.name;
        document.getElementById('pAuthor').innerText = g.author_nick;
        document.getElementById('pDesc').innerText = g.description;
        document.getElementById('pLikes').innerText = g.likes;
        document.getElementById('pDis').innerText = g.dislikes;
    }

    function playGame() {
        const g = games.find(x => x.id === currentGId);
        document.getElementById('gameIframe').src = g.game_url;
        document.getElementById('gameScreen').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    async function rate(type) {
        if(!user) return alert('Войдите в аккаунт!');
        const g = games.find(x => x.id === currentGId);
        const newLikes = type === 'like' ? g.likes + 1 : g.likes;
        const newDis = type === 'dislike' ? g.dislikes + 1 : g.dislikes;
        await supabase.from('games').update({ likes: newLikes, dislikes: newDis }).eq('id', currentGId);
        await loadGames();
    }

    function showTab(tab) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('searchInput').value = '';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('playPage').style.display = 'none';

        if(tab === 'my' && user) {
            document.getElementById('nav-my').classList.add('active');
            document.getElementById('tabTitle').innerText = 'МОИ ИГРЫ';
        } else {
            document.getElementById('nav-rec').classList.add('active');
            document.getElementById('tabTitle').innerText = 'РЕКОМЕНДАЦИИ';
        }
        filterGames();
    }

    function closePlay() { showTab('rec'); }
    function closeGameScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('gameIframe').src = '';
        document.body.style.overflow = 'auto';
    }
    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
